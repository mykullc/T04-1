<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: Arial, sans-serif;
      color: #263238;
      background: #f5f8fa;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border: 3px solid #546e7a;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>
  <h1>T04 – SVG House &amp; Garden</h1>

  <svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-description">
    <title id="scene-title">A house and garden on a sunny day</title>
    <desc id="scene-description">
      A red-roofed house with a chimney, door, and two windows sits in a green garden.
      The scene also has a sun, cloud, tree, fence, curved path, and caption.
    </desc>

    <!-- A rectangle makes the blue sky; another rectangle makes the green grass. -->
    <rect x="0" y="0" width="800" height="330" fill="#b9e6ff" />
    <rect x="0" y="330" width="800" height="170" fill="#8bcf75" />

    <!-- A circle is the sun. -->
    <circle cx="690" cy="85" r="42" fill="#ffd54f" />

    <!-- Overlapping ellipses make a soft cloud. -->
    <ellipse cx="145" cy="105" rx="48" ry="25" fill="white" />
    <ellipse cx="185" cy="92" rx="37" ry="30" fill="white" />
    <ellipse cx="220" cy="108" rx="43" ry="23" fill="white" />

    <!-- A rectangle is the tree trunk, with circles for its leafy crown. -->
    <rect x="92" y="245" width="34" height="105" fill="#795548" />
    <circle cx="108" cy="215" r="52" fill="#388e3c" />
    <circle cx="75" cy="235" r="34" fill="#43a047" />
    <circle cx="142" cy="236" r="36" fill="#43a047" />

    <!-- A rectangle forms the house body and a polygon forms its roof. -->
    <rect x="285" y="220" width="270" height="190" fill="#fff3d6" stroke="#795548" stroke-width="4" />
    <polygon points="260,230 420,110 580,230" fill="#c94c4c" stroke="#813333" stroke-width="4" />

    <!-- A small rectangle is the chimney. -->
    <rect x="485" y="145" width="38" height="72" fill="#a84343" stroke="#813333" stroke-width="3" />

    <!-- The door and two windows are rectangles. -->
    <rect x="390" y="310" width="62" height="100" fill="#8d5a3b" stroke="#5d3925" stroke-width="3" />
    <circle cx="440" cy="363" r="4" fill="#ffd54f" />
    <rect x="315" y="255" width="58" height="54" fill="#9de3f5" stroke="#5b7882" stroke-width="3" />
    <rect x="467" y="255" width="58" height="54" fill="#9de3f5" stroke="#5b7882" stroke-width="3" />

    <!-- Lines divide each window into four panes. -->
    <line x1="344" y1="255" x2="344" y2="309" stroke="#5b7882" stroke-width="3" />
    <line x1="315" y1="282" x2="373" y2="282" stroke="#5b7882" stroke-width="3" />
    <line x1="496" y1="255" x2="496" y2="309" stroke="#5b7882" stroke-width="3" />
    <line x1="467" y1="282" x2="525" y2="282" stroke="#5b7882" stroke-width="3" />

    <!-- A polyline makes a simple zig-zag fence. -->
    <polyline points="30,350 30,315 70,315 70,350 110,350 110,315 150,315 150,350 190,350 190,315 230,315 230,350"
      fill="none" stroke="#8d5a3b" stroke-width="8" stroke-linejoin="round" />
    <line x1="25" y1="333" x2="235" y2="333" stroke="#8d5a3b" stroke-width="6" />
    <line x1="25" y1="350" x2="235" y2="350" stroke="#8d5a3b" stroke-width="6" />

    <!-- A curved path leads from the house door toward the viewer. -->
    <path d="M 421 410 C 420 440, 470 450, 455 500 L 610 500 C 560 450, 485 435, 452 410 Z"
      fill="#d8c6a3" stroke="#b09a73" stroke-width="3" />

    <!-- Text adds a caption to the garden scene. -->
    <text x="400" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">
      Welcome to our garden!
    </text>
  </svg>
</body>
</html>
