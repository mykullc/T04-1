<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: Arial, sans-serif;
      color: #263238;
      background: #f5f8fa;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      border: 3px solid #546e7a;
      border-radius: 8px;
      background: white;
    }

    /* These finishing touches apply only to the adjusted illustration. */
    #scene-adjusted .house-wall {
      stroke: #56351f;
      stroke-width: 5;
    }

    #scene-adjusted .house-detail {
      stroke-width: 4;
    }

    #scene-adjusted .tree-trunk {
      stroke: #402719;
      stroke-width: 3;
    }

    #scene-adjusted .adjusted-label {
      font: bold 18px Arial, sans-serif;
      fill: #173d2b;
      stroke: none;
    }
  </style>
</head>
<body>
  <h1>T04 – SVG House &amp; Garden</h1>

  <figure id="scene-original">
    <figcaption>Original scene</figcaption>
  <svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-description">
    <title id="scene-title">A house and garden on a sunny day</title>
    <desc id="scene-description">
      A red-roofed house with a chimney, door, and two windows sits in a green garden.
      The scene also has a sun, cloud, tree, fence, curved path, and caption.
    </desc>

    <!-- A rectangle makes the blue sky; another rectangle makes the green grass. -->
    <rect x="0" y="0" width="800" height="330" fill="#b9e6ff" />
    <rect x="0" y="330" width="800" height="170" fill="#8bcf75" />

    <!-- A circle is the sun. -->
    <circle cx="690" cy="85" r="42" fill="#ffd54f" />

    <!-- Overlapping ellipses make a soft cloud. -->
    <ellipse cx="145" cy="105" rx="48" ry="25" fill="white" />
    <ellipse cx="185" cy="92" rx="37" ry="30" fill="white" />
    <ellipse cx="220" cy="108" rx="43" ry="23" fill="white" />

    <!-- A rectangle is the tree trunk, with circles for its leafy crown. -->
    <rect x="92" y="245" width="34" height="105" fill="#795548" />
    <circle cx="108" cy="215" r="52" fill="#388e3c" />
    <circle cx="75" cy="235" r="34" fill="#43a047" />
    <circle cx="142" cy="236" r="36" fill="#43a047" />

    <!-- A rectangle forms the house body and a polygon forms its roof. -->
    <rect x="285" y="220" width="270" height="190" fill="#fff3d6" stroke="#795548" stroke-width="4" />
    <polygon points="260,230 420,110 580,230" fill="#c94c4c" stroke="#813333" stroke-width="4" />

    <!-- A small rectangle is the chimney. -->
    <rect x="485" y="145" width="38" height="72" fill="#a84343" stroke="#813333" stroke-width="3" />

    <!-- The door and two windows are rectangles. -->
    <rect x="390" y="310" width="62" height="100" fill="#8d5a3b" stroke="#5d3925" stroke-width="3" />
    <circle cx="440" cy="363" r="4" fill="#ffd54f" />
    <rect x="315" y="255" width="58" height="54" fill="#9de3f5" stroke="#5b7882" stroke-width="3" />
    <rect x="467" y="255" width="58" height="54" fill="#9de3f5" stroke="#5b7882" stroke-width="3" />

    <!-- Lines divide each window into four panes. -->
    <line x1="344" y1="255" x2="344" y2="309" stroke="#5b7882" stroke-width="3" />
    <line x1="315" y1="282" x2="373" y2="282" stroke="#5b7882" stroke-width="3" />
    <line x1="496" y1="255" x2="496" y2="309" stroke="#5b7882" stroke-width="3" />
    <line x1="467" y1="282" x2="525" y2="282" stroke="#5b7882" stroke-width="3" />

    <!-- A polyline makes a simple zig-zag fence. -->
    <polyline points="30,350 30,315 70,315 70,350 110,350 110,315 150,315 150,350 190,350 190,315 230,315 230,350"
      fill="none" stroke="#8d5a3b" stroke-width="8" stroke-linejoin="round" />
    <line x1="25" y1="333" x2="235" y2="333" stroke="#8d5a3b" stroke-width="6" />
    <line x1="25" y1="350" x2="235" y2="350" stroke="#8d5a3b" stroke-width="6" />

    <!-- A curved path leads from the house door toward the viewer. -->
    <path d="M 421 410 C 420 440, 470 450, 455 500 L 610 500 C 560 450, 485 435, 452 410 Z"
      fill="#d8c6a3" stroke="#b09a73" stroke-width="3" />

    <!-- Text adds a caption to the garden scene. -->
    <text x="400" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">
      Welcome to our garden!
    </text>
  </svg>
  </figure>

  <figure>
    <svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="scene-annotated-title scene-annotated-description">
      <title id="scene-annotated-title">A house and garden on a sunny day, with shape annotations</title>
      <desc id="scene-annotated-description">
        A red-roofed house and garden scene with labels showing the coordinates and attributes
        of example SVG shapes.
      </desc>

      <!-- A rectangle makes the blue sky; another rectangle makes the green grass. -->
      <rect x="0" y="0" width="800" height="330" fill="#b9e6ff" />
      <rect x="0" y="330" width="800" height="170" fill="#8bcf75" />

      <!-- A circle is the sun. -->
      <circle cx="690" cy="85" r="42" fill="#ffd54f" />

      <!-- Overlapping ellipses make a soft cloud. -->
      <ellipse cx="145" cy="105" rx="48" ry="25" fill="white" />
      <ellipse cx="185" cy="92" rx="37" ry="30" fill="white" />
      <ellipse cx="220" cy="108" rx="43" ry="23" fill="white" />

      <!-- A rectangle is the tree trunk, with circles for its leafy crown. -->
      <rect x="92" y="245" width="34" height="105" fill="#795548" />
      <circle cx="108" cy="215" r="52" fill="#388e3c" />
      <circle cx="75" cy="235" r="34" fill="#43a047" />
      <circle cx="142" cy="236" r="36" fill="#43a047" />

      <!-- A rectangle forms the house body and a polygon forms its roof. -->
      <rect x="285" y="220" width="270" height="190" fill="#fff3d6" stroke="#795548" stroke-width="4" />
      <polygon points="260,230 420,110 580,230" fill="#c94c4c" stroke="#813333" stroke-width="4" />

      <!-- A small rectangle is the chimney. -->
      <rect x="485" y="145" width="38" height="72" fill="#a84343" stroke="#813333" stroke-width="3" />

      <!-- The door and two windows are rectangles. -->
      <rect x="390" y="310" width="62" height="100" fill="#8d5a3b" stroke="#5d3925" stroke-width="3" />
      <circle cx="440" cy="363" r="4" fill="#ffd54f" />
      <rect x="315" y="255" width="58" height="54" fill="#9de3f5" stroke="#5b7882" stroke-width="3" />
      <rect x="467" y="255" width="58" height="54" fill="#9de3f5" stroke="#5b7882" stroke-width="3" />

      <!-- Lines divide each window into four panes. -->
      <line x1="344" y1="255" x2="344" y2="309" stroke="#5b7882" stroke-width="3" />
      <line x1="315" y1="282" x2="373" y2="282" stroke="#5b7882" stroke-width="3" />
      <line x1="496" y1="255" x2="496" y2="309" stroke="#5b7882" stroke-width="3" />
      <line x1="467" y1="282" x2="525" y2="282" stroke="#5b7882" stroke-width="3" />

      <!-- A polyline makes a simple zig-zag fence. -->
      <polyline points="30,350 30,315 70,315 70,350 110,350 110,315 150,315 150,350 190,350 190,315 230,315 230,350"
        fill="none" stroke="#8d5a3b" stroke-width="8" stroke-linejoin="round" />
      <line x1="25" y1="333" x2="235" y2="333" stroke="#8d5a3b" stroke-width="6" />
      <line x1="25" y1="350" x2="235" y2="350" stroke="#8d5a3b" stroke-width="6" />

      <!-- A curved path leads from the house door toward the viewer. -->
      <path d="M 421 410 C 420 440, 470 450, 455 500 L 610 500 C 560 450, 485 435, 452 410 Z"
        fill="#d8c6a3" stroke="#b09a73" stroke-width="3" />

      <!-- Text adds a caption to the garden scene. -->
      <text x="400" y="475" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">
        Welcome to our garden!
      </text>

      <!-- Thin leaders point from labels to the matching shapes. -->
      <g id="annotations" font-family="Arial, sans-serif" font-size="10" fill="#263238" stroke="#263238" stroke-width="1">
        <line x1="585" y1="47" x2="654" y2="70" />
        <line x1="238" y1="86" x2="214" y2="92" />
        <line x1="295" y1="425" x2="286" y2="405" />
        <line x1="311" y1="240" x2="344" y2="255" />
        <line x1="210" y1="375" x2="190" y2="350" />
        <line x1="584" y1="188" x2="565" y2="218" />
        <line x1="605" y1="300" x2="520" y2="430" />
        <line x1="574" y1="463" x2="543" y2="475" />

        <g stroke="none">
          <text x="525" y="42">circle: cx=690, cy=85, r=42</text>
          <text x="239" y="84">ellipse: cx=185, cy=92, rx=37, ry=30</text>
          <text x="265" y="438">rect: x=285, y=220, width=270, height=190</text>
          <text x="245" y="235">line: (344,255) to (344,309)</text>
          <text x="8" y="375">polyline points: 30,350 30,315 70,315</text>
          <text x="8" y="387">70,350 110,350 110,315 150,315</text>
          <text x="8" y="399">150,350 190,350 190,315 230,315</text>
          <text x="8" y="411">230,350</text>
          <text x="583" y="172">polygon points:</text>
          <text x="583" y="184">260,230 420,110 580,230</text>
          <text x="610" y="270">path d:</text>
          <text x="610" y="282">M 421 410 C 420 440, 470 450, 455 500</text>
          <text x="610" y="294">L 610 500 C 560 450, 485 435,</text>
          <text x="610" y="306">452 410 Z</text>
          <text x="580" y="460">text x=400, y=475</text>
        </g>
      </g>
    </svg>
    <figcaption>Annotated scene (Step 2)</figcaption>
  </figure>

  <!-- Step 3 keeps the same scene scale while improving contrast and adding details. -->
  <figure id="scene-adjusted-figure">
    <svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="scene-adjusted-title scene-adjusted-description">
      <title id="scene-adjusted-title">Adjusted house and garden scene</title>
      <desc id="scene-adjusted-description">
        A high-contrast house and tree sit in a garden with a dashed fence, curved stone path,
        mailbox, chimney smoke, sun, cloud, and caption.
      </desc>

      <!-- Deepen the grass and sky colours for stronger contrast. -->
      <rect x="0" y="0" width="800" height="330" fill="#a9dcf5" />
      <rect x="0" y="330" width="800" height="170" fill="#75b957" />
      <circle cx="690" cy="85" r="42" fill="#ffca28" stroke="#8a5a00" stroke-width="3" />
      <ellipse cx="145" cy="105" rx="48" ry="25" fill="#ffffff" stroke="#57717d" stroke-width="2" />
      <ellipse cx="185" cy="92" rx="37" ry="30" fill="#ffffff" stroke="#57717d" stroke-width="2" />
      <ellipse cx="220" cy="108" rx="43" ry="23" fill="#ffffff" stroke="#57717d" stroke-width="2" />

      <!-- This path sits behind the house and has curved joints to suggest separate stones. -->
      <path d="M 445 397 C 430 425, 490 440, 470 500 L 620 500 C 570 447, 500 425, 476 397 Z"
        fill="#c8c0aa" stroke="#514b40" stroke-width="4" />
      <path d="M 442 411 Q 458 418, 482 414 M 449 428 Q 474 438, 503 431 M 463 449 Q 493 462, 525 451 M 474 472 Q 512 486, 550 472"
        fill="none" stroke="#746b5b" stroke-width="3" />

      <!-- Shift the tree slightly right and upward as a single group. -->
      <g transform="translate(24,-8)">
        <rect class="tree-trunk" x="92" y="245" width="34" height="105" fill="#704326" />
        <circle cx="108" cy="215" r="52" fill="#246b36" stroke="#164724" stroke-width="4" />
        <circle cx="75" cy="235" r="34" fill="#2f8242" stroke="#164724" stroke-width="3" />
        <circle cx="142" cy="236" r="36" fill="#2f8242" stroke="#164724" stroke-width="3" />
      </g>

      <!-- The fence keeps its shape but now uses a dashed, heavier stroke. -->
      <polyline points="30,350 30,315 70,315 70,350 110,350 110,315 150,315 150,350 190,350 190,315 230,315 230,350"
        fill="none" stroke="#59351f" stroke-width="7" stroke-dasharray="10 5" stroke-linejoin="round" />
      <line x1="25" y1="333" x2="235" y2="333" stroke="#59351f" stroke-width="5" stroke-dasharray="10 5" />
      <line x1="25" y1="350" x2="235" y2="350" stroke="#59351f" stroke-width="5" stroke-dasharray="10 5" />

      <!-- Shift the house slightly right and upward using one transform. -->
      <g transform="translate(24,-10)">
        <rect class="house-wall" x="285" y="220" width="270" height="190" fill="#fff0c2" />
        <polygon points="260,230 420,110 580,230" fill="#a93636" stroke="#5d2020" stroke-width="5" />
        <rect x="485" y="145" width="38" height="72" fill="#893333" stroke="#5d2020" stroke-width="4" />
        <rect x="390" y="310" width="62" height="100" fill="#714126" stroke="#3e281b" stroke-width="4" />
        <circle cx="440" cy="363" r="4" fill="#ffca28" />
        <rect class="house-detail" x="315" y="255" width="58" height="54" fill="#8ad5eb" stroke="#254b58" />
        <rect class="house-detail" x="467" y="255" width="58" height="54" fill="#8ad5eb" stroke="#254b58" />
        <line x1="344" y1="255" x2="344" y2="309" stroke="#254b58" stroke-width="4" />
        <line x1="315" y1="282" x2="373" y2="282" stroke="#254b58" stroke-width="4" />
        <line x1="496" y1="255" x2="496" y2="309" stroke="#254b58" stroke-width="4" />
        <line x1="467" y1="282" x2="525" y2="282" stroke="#254b58" stroke-width="4" />
      </g>

      <!-- Ellipses make a small trail of smoke above the shifted chimney. -->
      <ellipse cx="527" cy="124" rx="13" ry="9" fill="#edf2f4" stroke="#52636b" stroke-width="2" />
      <ellipse cx="541" cy="105" rx="17" ry="11" fill="#edf2f4" stroke="#52636b" stroke-width="2" />
      <ellipse cx="524" cy="84" rx="12" ry="8" fill="#edf2f4" stroke="#52636b" stroke-width="2" />

      <!-- A mailbox near the path uses a post, rectangular body, and polygon cap. -->
      <rect x="559" y="454" width="8" height="36" fill="#493a2a" stroke="#241c14" stroke-width="2" />
      <rect x="540" y="420" width="46" height="34" rx="3" fill="#173f70" stroke="#102a49" stroke-width="4" />
      <polygon points="540,420 563,404 586,420" fill="#275b91" stroke="#102a49" stroke-width="4" />
      <text x="563" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">MAIL</text>

      <!-- This caption belongs only to the adjusted scene. -->
      <text class="adjusted-label" x="400" y="475" text-anchor="middle">
        Welcome to our garden!
      </text>
    </svg>
    <figcaption>Adjusted scene (Step 3)</figcaption>
  </figure>
</body>
</html>
